<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eCommerce Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert-info {
            background: #e7f3ff;
            color: #0066cc;
            border: 1px solid #b3d9ff;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 13px;
        }

        .test-credentials {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .test-credentials h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #555;
        }

        .test-credentials p {
            margin: 5px 0;
            color: #666;
        }

        .test-credentials code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🛍️ eCommerce Admin</h1>
            <p>Sign in to access your dashboard</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="test-credentials">
            <h3>🔑 Test Credentials</h3>
            <p><strong>Admin:</strong> <code>admin@example.com</code> / <code>admin123</code></p>
            <p><strong>User:</strong> <code>john@example.com</code> / <code>user123</code></p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner hidden"></span>
            </button>
        </form>

        <div class="footer">
            <p>Secured with JWT Authentication</p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBox = document.getElementById('alert');

        // Check if already logged in
        const token = localStorage.getItem('adminToken');
        if (token) {
            showAlert('You are already logged in. Redirecting to admin panel...', 'info');
            setTimeout(() => {
                window.location.href = '/admin-redirect.html';
            }, 1500);
        }

        // Check for error messages in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const logout = urlParams.get('logout');

        if (logout === 'true') {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            showAlert('You have been logged out successfully.', 'success');
        } else if (error === 'invalid_token') {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            showAlert('Your session has expired. Please login again.', 'error');
        } else if (error === 'user_not_found') {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            showAlert('User not found. Please login again.', 'error');
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    alertBox.className = 'alert';
                }, 5000);
            }
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Signing in...';
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            setLoading(true);
            alertBox.className = 'alert';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store the token
                    localStorage.setItem('adminToken', data.data.token);
                    localStorage.setItem('adminUser', JSON.stringify({
                        id: data.data.userId,
                        name: data.data.name,
                        email: data.data.email,
                        role: data.data.role
                    }));

                    showAlert(`Welcome back, ${data.data.name}! Creating session...`, 'success');
                    
                    // Call SSO endpoint to create AdminJS session
                    try {
                        const ssoResponse = await fetch('/api/admin-sso', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ token: data.data.token }),
                        });

                        const ssoData = await ssoResponse.json();

                        if (ssoResponse.ok && ssoData.success) {
                            showAlert('Session created! Redirecting to admin panel...', 'success');
                            // Redirect to admin panel
                            setTimeout(() => {
                                window.location.href = ssoData.redirectTo || '/admin';
                            }, 1000);
                        } else {
                            showAlert(ssoData.message || 'Failed to create session. Please try again.', 'error');
                            setLoading(false);
                        }
                    } catch (ssoError) {
                        console.error('SSO error:', ssoError);
                        showAlert('Failed to create admin session. Please try again.', 'error');
                        setLoading(false);
                    }
                } else {
                    showAlert(data.message || 'Invalid email or password', 'error');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Unable to connect to server. Please try again.', 'error');
                setLoading(false);
            }
        });

        // Quick fill buttons (for testing)
        document.addEventListener('keydown', (e) => {
            // Press Alt+A for admin credentials
            if (e.altKey && e.key === 'a') {
                e.preventDefault();
                emailInput.value = 'admin@example.com';
                passwordInput.value = 'admin123';
                showAlert('Admin credentials filled. Press Enter to login.', 'info');
            }
            // Press Alt+U for user credentials
            if (e.altKey && e.key === 'u') {
                e.preventDefault();
                emailInput.value = 'john@example.com';
                passwordInput.value = 'user123';
                showAlert('User credentials filled. Press Enter to login.', 'info');
            }
        });
    </script>
</body>
</html>
